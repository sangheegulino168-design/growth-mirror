[package]
name = "growth-mirror-desktop"
version = "0.2.0"
description = "Growth Mirror desktop shell"
authors = ["Growth Mirror"]
edition = "2021"

[lib]
name = "growth_mirror_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
